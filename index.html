<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalCertify - Dashboard UMKM</title>
    <!-- Menggunakan Tailwind CSS untuk desain modern dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <div class="container mx-auto p-6 max-w-6xl">
        <h1 class="text-3xl font-bold mb-8 text-green-700">Dashboard Sertifikasi Halal</h1>
        
        <!-- Form Pengajuan Awal -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-8">
            <h2 class="text-xl font-semibold mb-4">Pengajuan Baru</h2>
            <form id="formPengajuan" class="flex gap-4">
                <input type="text" id="namaUsaha" placeholder="Nama Pelaku Usaha" required 
                       class="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:border-green-500">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Ajukan</button>
            </form>
        </div>

        <!-- Tabel Dashboard -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                        <th class="p-4 border-b">Nama Usaha</th>
                        <th class="p-4 border-b">No Daftar</th>
                        <th class="p-4 border-b">Status SH</th>
                        <th class="p-4 border-b">Auditor</th>
                        <th class="p-4 border-b">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan dimuat dari script.js -->
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
