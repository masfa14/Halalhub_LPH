<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Halal Sertif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-green-900">Dashboard Manajemen Sertifikasi</h1>
            <button onclick="bukaModalBuat()" class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-800 transition">
                + Pengajuan Awal
            </button>
        </div>

        <!-- Tabel Data -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-sm">
                        <th class="p-4 font-semibold text-slate-600">No</th>
                        <th class="p-4 font-semibold text-slate-600">ID / Nama PU</th>
                        <th class="p-4 font-semibold text-slate-600">No Daftar</th>
                        <th class="p-4 font-semibold text-slate-600">Status SH</th>
                        <th class="p-4 font-semibold text-slate-600">Pembayaran</th>
                        <th class="p-4 font-semibold text-slate-600">Konsultan</th>
                        <th class="p-4 font-semibold text-slate-600">Auditor</th>
                        <th class="p-4 font-semibold text-slate-600">Waktu / Keterangan</th>
                        <th class="p-4 font-semibold text-slate-600">Fee</th>
                        <th class="p-4 font-semibold text-slate-600">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-body" class="text-sm divide-y divide-slate-200">
                    <tr><td colspan="10" class="p-8 text-center text-slate-500">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Pengajuan Awal (Insert) -->
    <div id="modalInsert" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-md">
            <h2 class="text-lg font-bold mb-4">Buat Pengajuan Baru</h2>
            <form id="formInsert" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pelaku Usaha *</label>
                    <input type="text" id="ins_nama" required class="w-full p-2 border rounded-lg focus:ring-green-500">
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="tutupModalInsert()" class="px-4 py-2 border rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-green-700 text-white rounded-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Update Data -->
    <div id="modalUpdate" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold mb-4">Update Pengajuan: <span id="upd_id_label" class="text-green-700"></span></h2>
            <form id="formUpdate" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <input type="hidden" id="upd_id_pengajuan">
                
                <div>
                    <label class="block text-sm font-medium mb-1">Nomor Daftar</label>
                    <input type="text" id="upd_no_daftar" class="w-full p-2 border rounded-lg">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Status SH</label>
                    <select id="upd_status_sh" class="w-full p-2 border rounded-lg">
                        <option value="Draf PU">Draf PU</option>
                        <option value="Submitted PU">Submitted PU</option>
                        <option value="Verified">Verified</option>
                        <option value="Dikembalikan PU">Dikembalikan PU</option>
                        <option value="Dikirim ke LPH">Dikirim ke LPH</option>
                        <option value="Dibatalkan">Dibatalkan</option>
                        <option value="Pembayaran">Pembayaran</option>
                        <option value="Review LPH">Review LPH</option>
                        <option value="Dikirim ke Komisi Fatwa">Dikirim ke Komisi Fatwa</option>
                        <option value="Terbit SH">Terbit SH</option>
                        <option value="Proses di LPH">Proses di LPH</option>
                        <option value="Penetapan Biaya">Penetapan Biaya</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Bayar Via</label>
                    <select id="upd_bayar_via" class="w-full p-2 border rounded-lg">
                        <option value="">-- Pilih --</option>
                        <option value="SiHalal">SiHalal</option>
                        <option value="LPH">LPH</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Status Bayar</label>
                    <select id="upd_status_bayar" class="w-full p-2 border rounded-lg">
                        <option value="">-- Pilih --</option>
                        <option value="Sudah Bayar">Sudah Bayar</option>
                        <option value="Belum Bayar">Belum Bayar</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Konsultan</label>
                    <select id="upd_konsultan" class="w-full p-2 border rounded-lg"></select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Auditor</label>
                    <select id="upd_auditor" class="w-full p-2 border rounded-lg"></select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Waktu Audit</label>
                    <input type="date" id="upd_waktu" class="w-full p-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Fee</label>
                    <select id="upd_fee" class="w-full p-2 border rounded-lg">
                        <option value="Belum Bayar">Belum Bayar</option>
                        <option value="Sudah Bayar">Sudah Bayar</option>
                    </select>
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Keterangan</label>
                    <textarea id="upd_keterangan" rows="2" class="w-full p-2 border rounded-lg"></textarea>
                </div>

                <div class="col-span-1 md:col-span-2 flex justify-end gap-2 mt-4">
                    <button type="button" onclick="tutupModalUpdate()" class="px-4 py-2 border rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-green-700 text-white rounded-lg">Update Data</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycb.../exec';
        let rawData = [];
        let dbKonsultan = [];
        let dbAuditor = [];

        async function initDashboard() {
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                
                if(result.status === 'success') {
                    rawData = result.data;
                    dbKonsultan = result.db_konsultan;
                    dbAuditor = result.db_auditor;
                    
                    renderTable();
                    populateDropdowns();
                }
            } catch (err) {
                document.getElementById('tabel-body').innerHTML = `<tr><td colspan="10" class="p-8 text-center text-red-500">Gagal memuat data</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '';
            
            rawData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4">${row['Nomor'] || index + 1}</td>
                    <td class="p-4">
                        <span class="font-bold block">${row['Nama Pelaku Usaha']}</span>
                        <span class="text-xs text-slate-400">${row['ID Pengajuan']}</span>
                    </td>
                    <td class="p-4">${row['No Daftar'] || '-'}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 bg-blue-50 text-blue-700 rounded-md text-xs">${row['Status SH']}</span>
                    </td>
                    <td class="p-4">
                        <span class="block">${row['Bayar Via'] || '-'}</span>
                        <span class="text-xs font-semibold ${row['Status Bayar'] === 'Sudah Bayar' ? 'text-green-600' : 'text-red-500'}">${row['Status Bayar'] || ''}</span>
                    </td>
                    <td class="p-4">${row['Nama Konsultan'] || '-'}</td>
                    <td class="p-4">${row['Nama Auditor'] || '-'}</td>
                    <td class="p-4">
                        <span class="block">${row['Waktu Audit'] || '-'}</span>
                        <span class="text-xs text-slate-500 truncate max-w-[150px] block">${row['Keterangan'] || ''}</span>
                    </td>
                    <td class="p-4 font-semibold ${row['Fee'] === 'Sudah Bayar' ? 'text-green-600' : 'text-slate-600'}">${row['Fee']}</td>
                    <td class="p-4">
                        <button onclick="bukaModalUpdate('${row['ID Pengajuan']}')" class="text-green-600 hover:underline">Edit</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function populateDropdowns() {
            const konsultanSelect = document.getElementById('upd_konsultan');
            const auditorSelect = document.getElementById('upd_auditor');
            
            konsultanSelect.innerHTML = '<option value="">-- Pilih Konsultan --</option>';
            dbKonsultan.forEach(k => {
                konsultanSelect.innerHTML += `<option value="${k.id}|${k.nama}">${k.nama}</option>`;
            });

            auditorSelect.innerHTML = '<option value="">-- Pilih Auditor --</option>';
            dbAuditor.forEach(a => {
                auditorSelect.innerHTML += `<option value="${a.id}|${a.nama}">${a.nama}</option>`;
            });
        }

        // --- MANAJEMEN MODAL ---
        function bukaModalBuat() { document.getElementById('modalInsert').classList.remove('hidden'); }
        function tutupModalInsert() { document.getElementById('modalInsert').classList.add('hidden'); }
        function tutupModalUpdate() { document.getElementById('modalUpdate').classList.add('hidden'); }

        function bukaModalUpdate(idPengajuan) {
            const data = rawData.find(r => r['ID Pengajuan'] === idPengajuan);
            if(!data) return;

            document.getElementById('upd_id_label').innerText = idPengajuan;
            document.getElementById('upd_id_pengajuan').value = idPengajuan;
            
            document.getElementById('upd_no_daftar').value = data['No Daftar'];
            document.getElementById('upd_status_sh').value = data['Status SH'];
            document.getElementById('upd_bayar_via').value = data['Bayar Via'];
            document.getElementById('upd_status_bayar').value = data['Status Bayar'];
            document.getElementById('upd_waktu').value = data['Waktu Audit'];
            document.getElementById('upd_keterangan').value = data['Keterangan'];
            document.getElementById('upd_fee').value = data['Fee'];

            // Set select database
            if(data['ID Konsultan']) document.getElementById('upd_konsultan').value = `${data['ID Konsultan']}|${data['Nama Konsultan']}`;
            if(data['ID Auditor']) document.getElementById('upd_auditor').value = `${data['ID Auditor']}|${data['Nama Auditor']}`;

            document.getElementById('modalUpdate').classList.remove('hidden');
        }

        // --- SUBMIT HANDLERS ---
        document.getElementById('formInsert').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const payload = {
                action: 'insert',
                nama_pu: document.getElementById('ins_nama').value
            };

            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            tutupModalInsert();
            initDashboard(); // Reload data
            btn.innerText = 'Simpan';
            btn.disabled = false;
            e.target.reset();
        });

        document.getElementById('formUpdate').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = 'Mengupdate...';
            btn.disabled = true;

            // Split ID dan Nama dari value dropdown
            const valKons = document.getElementById('upd_konsultan').value.split('|');
            const valAud = document.getElementById('upd_auditor').value.split('|');

            const payload = {
                action: 'update',
                id_pengajuan: document.getElementById('upd_id_pengajuan').value,
                no_daftar: document.getElementById('upd_no_daftar').value,
                status_sh: document.getElementById('upd_status_sh').value,
                bayar_via: document.getElementById('upd_bayar_via').value,
                status_bayar: document.getElementById('upd_status_bayar').value,
                waktu_audit: document.getElementById('upd_waktu').value,
                keterangan: document.getElementById('upd_keterangan').value,
                fee: document.getElementById('upd_fee').value,
                id_konsultan: valKons[0] || '',
                nama_konsultan: valKons[1] || '',
                id_auditor: valAud[0] || '',
                nama_auditor: valAud[1] || ''
            };

            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            tutupModalUpdate();
            initDashboard(); // Reload data
            btn.innerText = 'Update Data';
            btn.disabled = false;
        });

        // Inisialisasi awal
        initDashboard();
    </script>
</body>
</html>
