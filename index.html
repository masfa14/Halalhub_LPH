<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalCertify - Dashboard UMKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <!-- Navbar -->
    <nav class="bg-green-700 text-white shadow-md">
        <div class="container mx-auto max-w-6xl flex items-center p-4">
            <h1 class="text-2xl font-bold mr-8">HalalCertify</h1>
            <div class="flex space-x-4">
                <button onclick="switchTab('dashboard')" class="hover:bg-green-600 px-3 py-2 rounded transition">Dashboard</button>
                <button onclick="switchTab('pengajuan')" class="hover:bg-green-600 px-3 py-2 rounded transition">Data Pengajuan</button>
                <button onclick="switchTab('konsultan')" class="hover:bg-green-600 px-3 py-2 rounded transition">Konsultan</button>
                <button onclick="switchTab('auditor')" class="hover:bg-green-600 px-3 py-2 rounded transition">Auditor</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-6xl mt-4">
        
        <!-- SECTION: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content">
            <h2 class="text-xl font-bold mb-6 text-gray-700">Ringkasan Sistem</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">Total Pengajuan</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="count-total">0</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm">Sedang Diproses</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="count-proses">0</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Selesai (Terbit SH)</p>
                    <h3 class="text-3xl font-bold text-gray-800" id="count-selesai">0</h3>
                </div>
            </div>
        </div>

        <!-- SECTION: PENGAJUAN -->
        <div id="tab-pengajuan" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Data Pengajuan UMKM</h2>
            <!-- (Form Pengajuan dan Tabel Pengajuan diletakkan di sini, sama seperti kode sebelumnya) -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                            <th class="p-4 border-b">Nama Usaha</th>
                            <th class="p-4 border-b">No Daftar</th>
                            <th class="p-4 border-b">Status SH</th>
                            <th class="p-4 border-b">Auditor</th>
                            <th class="p-4 border-b">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-pengajuan"><tr><td colspan="5" class="p-4 text-center">Memuat...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- SECTION: KONSULTAN -->
        <div id="tab-konsultan" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Database Konsultan</h2>
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-gray-100"><th class="p-4 border-b">ID Konsultan</th><th class="p-4 border-b">Nama Konsultan</th></tr></thead>
                    <tbody id="table-konsultan"></tbody>
                </table>
            </div>
        </div>

        <!-- SECTION: AUDITOR -->
        <div id="tab-auditor" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Database Auditor</h2>
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-gray-100"><th class="p-4 border-b">ID Auditor</th><th class="p-4 border-b">Nama Auditor</th></tr></thead>
                    <tbody id="table-auditor"></tbody>
                </table>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
